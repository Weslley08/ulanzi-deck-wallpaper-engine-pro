name: Bug report
description: Something on the key or in the settings panel is not working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste folder names or wallpaper paths that you want to keep private.** This is a public page.
        For a security problem, use the [private report](https://github.com/Weslley08/ulanzi-deck-wallpaper-engine-pro/security/advisories/new) instead.
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - D200
        - D200H
        - D200X
        - Dial
        - Other
        - No device (simulator or tests)
    validations:
      required: true
  - type: input
    id: studio
    attributes:
      label: Ulanzi Studio version
      placeholder: "3.3.0"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Wallpaper Engine PRO version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: running
    attributes:
      label: Was Wallpaper Engine running?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A photo of the key helps a lot. Some problems only show on the device.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Put the action on a key
        2. Enter the path to wallpaper64.exe
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Start Studio with --log and paste the lines mentioning this plugin. Check them for private folder names first.
      render: text
