name: Gate

# The jobs are in Weslley08/ulanzi-plugin-pipeline. This file says when they run and what differs for this plugin.
# It also runs each week, because problems get found after the last pull request.
on:
  pull_request:
    # edited: changing the base has to run the branch rules again.
    types: [opened, edited, reopened, synchronize]
  # An approval, or taking it back, decides whether a pull request to main may merge.
  pull_request_review:
    types: [submitted, dismissed]
  # No push trigger: each commit on a pull request already runs the Gate, and a merge adds nothing the pull request did not check.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # A called workflow can only keep or lower these, so what its CodeQL job needs has to be granted here.
    permissions:
      contents: read
      security-events: write
    # Same reference as Clima Pro. Move every plugin to @v1 together, once the pipeline maintainer has moved v1.
    uses: Weslley08/ulanzi-plugin-pipeline/.github/workflows/gate.yml@feat/maintainer-approval
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
